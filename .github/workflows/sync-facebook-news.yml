name: Auto Sync Facebook News to Website

on:
  schedule:
    # รันอัตโนมัติทุกๆ 2 ชั่วโมง (นาทีที่ 15 ของทุกคู่ชั่วโมง)
    - cron: '15 */2 * * *'
  workflow_dispatch: # เปิดให้กดรันด่วนได้ด้วยตนเองจากหน้าเว็บ GitHub Actions

permissions:
  contents: write  # ต้องใช้สิทธิ์เขียนเพื่อ commit รูปภาพกลับเข้า repo

jobs:
  sync-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Facebook Sync Script
        env:
          SUPABASE_URL: https://rsukgfvutcagkpcfatfw.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJzdWtnZnZ1dGNhZ2twY2ZhdGZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0NzQwODEsImV4cCI6MjA5OTA1MDA4MX0.YoIDvfwtSM-jO32vbRvsmV7mRzNd3UEB0epIAeAxyZ0
          FB_TARGET_ID: "100057502268064"
          FB_COOKIE: ${{ secrets.FB_COOKIE }}
        run: |
          node scripts/sync-facebook.js

      - name: Commit & Push Downloaded Photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/news/ || true
          if git diff --cached --quiet; then
            echo "📷 ไม่มีรูปภาพใหม่ที่ต้อง commit"
          else
            git commit -m "📷 auto: download Facebook photos for news"
            git push
            echo "✅ Commit รูปภาพใหม่เข้า repo สำเร็จ!"
          fi
